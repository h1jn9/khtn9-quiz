<style>
:root{--bg:#f4f6fb;--panel:#fff;--text:#172033;--muted:#69758b;--line:#e5eaf2;--primary:#5b6cff;--primary2:#8290ff;--soft:#eef0ff;--good:#168653;--bad:#d94b58;--shadow:0 18px 55px rgba(34,48,90,.10)}

*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,rgba(91,108,255,.12),transparent 35%),var(--bg);color:var(--text);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .25s,color .25s}
button{font:inherit;cursor:pointer;border:0}.wrap{max-width:1040px;margin:auto;padding:22px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:34px}.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:-.4px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#6878ff,#9b71f5);display:grid;place-items:center;color:white;font-size:22px;box-shadow:0 8px 20px #6878ff44}.theme{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 13px;border-radius:13px;box-shadow:var(--shadow)}
.hero{text-align:center;padding:28px 0 30px;animation:rise .55s ease both}.eyebrow{display:inline-flex;gap:7px;align-items:center;background:var(--soft);color:var(--primary);padding:6px 12px;border-radius:30px;font-weight:750;font-size:12px;letter-spacing:.5px}.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.12;letter-spacing:-1.5px;margin:17px 0 12px}.gradient{background:linear-gradient(100deg,#6474ff,#a36de8);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:var(--muted);max-width:590px;margin:auto;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.subject{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;text-align:left;box-shadow:var(--shadow);transition:.22s;position:relative;overflow:hidden}.subject:hover{transform:translateY(-5px);border-color:var(--primary2)}.subject .ico{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:26px;margin-bottom:16px}.physics .ico{background:#e9f1ff}.bio .ico{background:#e6f8ee}.chem .ico{background:#fff1df}.subject h2{font-size:20px;margin:0 0 6px}.subject p{color:var(--muted);min-height:48px;margin:0 0 18px;font-size:13px}.meta{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.go{color:var(--primary);font-weight:800}
.note{margin:22px auto 0;text-align:center;color:var(--muted);font-size:12px}
.hidden{display:none!important}.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:clamp(18px,3vw,30px);animation:rise .35s ease both}.quizhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.back{background:transparent;color:var(--muted);padding:7px 0;font-weight:700}.pill{border-radius:30px;padding:7px 12px;background:var(--soft);color:var(--primary);font-size:12px;font-weight:800}.progressrow{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:8px}.bar{height:8px;background:var(--line);border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#6474ff,#a36de8);border-radius:20px;transition:width .3s}
.qtop{display:flex;justify-content:space-between;align-items:center;margin:26px 0 10px;color:var(--muted);font-size:13px}.question{font-size:clamp(18px,2.8vw,22px);line-height:1.45;font-weight:780;letter-spacing:-.3px;margin:0 0 20px}.answers{display:flex;gap:12px;overflow:hidden;touch-action:pan-y;min-height:112px;align-items:stretch}.answer{display:none;flex:1;min-width:0;min-height:106px;align-items:center;justify-content:flex-start}.answer.active{display:flex;animation:cardIn .22s ease both}.swipehint{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin-top:12px}.answer-nav{display:flex;align-items:center;gap:8px}.dotrow{display:flex;gap:6px;justify-content:center;margin-top:12px}.dot{width:7px;height:7px;border-radius:10px;background:var(--line);transition:.2s}.dot.on{width:20px;background:var(--primary)}@keyframes cardIn{from{opacity:.35;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}.answer{display:flex;gap:13px;align-items:flex-start;width:100%;padding:14px 15px;text-align:left;border:1.5px solid var(--line);border-radius:15px;background:var(--panel);color:var(--text);transition:.18s}.answer:hover{border-color:var(--primary2);background:var(--soft)}.answer.selected{border-color:var(--primary);background:var(--soft);box-shadow:0 0 0 3px #7885ff20}.letter{width:28px;height:28px;flex:0 0 28px;border-radius:9px;background:var(--bg);display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:850}.selected .letter{background:var(--primary);color:white}.answer span:last-child{padding-top:2px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.btn{padding:12px 18px;border-radius:13px;font-weight:800;transition:.18s}.btn:active{transform:scale(.97)}.primary{background:linear-gradient(110deg,#6274ff,#9275ef);color:white;box-shadow:0 8px 18px #6878ff40}.secondary{background:var(--soft);color:var(--text)}.btn:disabled{opacity:.4;cursor:not-allowed}
.result{text-align:center}.score{font-size:56px;font-weight:900;letter-spacing:-2px;background:linear-gradient(110deg,#6474ff,#a36de8);color:transparent;background-clip:text;margin:8px 0}.result h2{margin:6px 0;font-size:27px}.result p{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.stat{background:var(--bg);border-radius:15px;padding:14px}.stat b{font-size:22px;display:block}.stat small{color:var(--muted)}
.review{text-align:left;margin-top:25px}.review h3{font-size:19px}.reviewitem{border:1px solid var(--line);border-radius:15px;padding:15px;margin:12px 0;background:var(--panel)}.reviewitem .tag{font-size:11px;font-weight:900;color:var(--bad)}.reviewitem p{margin:7px 0}.correct{color:var(--good);font-weight:750}.wrong{color:var(--bad);font-weight:750}.empty{padding:18px;background:var(--soft);border-radius:14px;color:var(--good);font-weight:700}
footer{text-align:center;color:var(--muted);font-size:11px;margin-top:28px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:760px){.grid{grid-template-columns:1fr}.subject{padding:19px}.subject p{min-height:0}.hero{padding-top:14px}.wrap{padding:15px 13px 40px}.top{margin-bottom:20px}.stats{gap:7px}.stat{padding:11px 6px}.stat b{font-size:19px}.actions .btn{padding:11px 14px}}

.question-list{display:grid;gap:18px;margin-top:24px}
.question-card{border:1px solid var(--line);border-radius:17px;padding:18px;background:var(--panel);scroll-margin-top:16px}
.question-card h3{font-size:16px;line-height:1.55;margin:0 0 14px}
.question-card .q-label{font-size:11px;letter-spacing:.6px;color:var(--primary);font-weight:900;margin-bottom:7px}
.question-options{display:grid;gap:9px}
.question-options .answer{display:flex;width:100%;min-height:0;align-items:flex-start;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);text-align:left;gap:10px}
.question-options .answer.selected{border-color:var(--primary);background:var(--soft)}
.question-options .letter{width:25px;height:25px;flex:0 0 25px}
.submit-area{text-align:center;margin-top:26px;padding:22px 10px 8px;border-top:1px solid var(--line)}
.submit-area p{color:var(--muted);font-size:13px;margin:0 0 14px}
.submit-btn{min-width:min(100%,260px);padding:15px 24px;font-size:16px}
.copyright{text-align:center;color:var(--muted);font-size:11px;margin-top:26px;padding-top:14px;border-top:1px solid var(--line)}
@media(max-width:600px){.question-card{padding:14px}.question-card h3{font-size:15px}.question-list{gap:13px}}

/* Dark-mode readability fixes for subject selection cards */
.subject{color:var(--text)}
.subject h2{color:var(--text)}
.subject .meta{color:var(--muted)}
/* Match printed worksheet typography more closely */
.question-card h3{font-size:15px;font-weight:650;line-height:1.55;letter-spacing:0}
.question-options .answer{font-size:14px;line-height:1.5}
</style></head>

<script>
const bank={"physics":{"name":"Vật lý 9","q":[["Trong bộ thí nghiệm quang học môn KHTN 9, dụng cụ nào sau đây dùng để hội tụ hoặc phân kì chùm tia sáng truyền qua nó?",["Màn chắn.","Thấu kính.","Giá quang học.","Nguồn sáng."],1,"Thấu kính có thể làm hội tụ hoặc phân kì chùm tia sáng truyền qua nó."],["Khi quan sát nhãn dán trên các chai, lọ đựng hoá chất trong phòng thí nghiệm môn KHTN, thông tin nào sau đây bắt buộc phải có để nhận biết hoá chất và sử dụng an toàn?",["Tên hoá chất, công thức hoá học và các kí hiệu cảnh báo nguy hiểm.","Giá bán lẻ của hoá chất trên thị trường.","Tên của người trực tiếp mua lọ hoá chất đó.","Địa chỉ nhà riêng của người sản xuất hoá chất."],0,"Nhãn hoá chất cần có tên, công thức và kí hiệu cảnh báo nguy hiểm."],["Động năng của một vật khối lượng m đang chuyển động với vận tốc v được tính theo công thức nào sau đây?",["Wđ = m.v","Wđ = ½.m.v²","Wđ = m.v²","Wđ = ½.m.v"],1,"Động năng được tính bằng Wđ = ½mv²."],["Cơ năng của một vật chuyển động trong trọng trường là:",["Tổng động năng và thế năng của vật.","Hiệu giữa động năng và thế năng của vật.","Tích của động năng và thế năng của vật.","Thương số giữa thế năng và động năng của vật."],0,"Cơ năng bằng tổng động năng và thế năng."],["Hai vật A và B có cùng khối lượng đặt ở hai vị trí khác nhau so với mặt đất. Biết vị trí của vật A có độ cao lớn gấp đôi vị trí của vật B (h_A = 2h_B). Chọn mốc thế năng tại mặt đất, thế năng trọng trường của hai vật thoả mãn:",["W_tA = W_tB","W_tB = 2W_tA","W_tA = 2W_tB","W_tA = 4W_tB"],2,"W_t = mgh. Hai vật cùng khối lượng nên h_A = 2h_B suy ra W_tA = 2W_tB."],["Trong quá trình một quả táo rụng từ trên cành cây rơi tự do xuống mặt đất (bỏ qua sức cản không khí), sự chuyển hoá năng lượng diễn ra như thế nào?",["Động năng tăng dần, thế năng giảm dần.","Động năng giảm dần, thế năng tăng dần.","Cả động năng và thế năng đều tăng.","Cả động năng và thế năng đều không đổi."],0,"Khi rơi, động năng tăng dần và thế năng giảm dần."],["Một vận động viên chạy bộ có khối lượng m = 60kg đang chạy đều với tốc độ v = 4m/s. Động năng của vận động viên đó là:",["240J.","480J.","960J.","120J."],1,"Wđ = ½ × 60 × 4² = 480J."],["Trong hệ thống đo lường quốc tế (SI), đơn vị đo của công suất là gì?",["Jun (J).","Oát (W).","Niutơn (N).","Jun trên giây (J/s)."],1,"Đơn vị SI của công suất là oát (W)."],["Trường hợp nào sau đây lực tác dụng không thực hiện công cơ học?",["Lực kéo của con ngựa làm chiếc xe chuyển động trên đường.","Trọng lực tác dụng làm quả bưởi rơi từ trên cây xuống đất.","Lực đẩy của một người tác dụng vào bức tường bê tông nhưng bức tường không di chuyển.","Lực kéo của động cơ thang máy đưa buồng thang máy lên tầng cao."],2,"Vật không dịch chuyển nên lực không thực hiện công cơ học."],["Một máy nâng thứ nhất thực hiện được công 1000J trong thời gian 10s. Một máy nâng thứ hai thực hiện được công 1000J trong thời gian 5s. Kết luận nào sau đây là đúng?",["Máy thứ nhất có công suất lớn hơn máy thứ hai.","Máy thứ hai có công suất lớn hơn máy thứ nhất.","Hai máy có công suất hoạt động bằng nhau.","Chưa thể so sánh được công suất của hai máy."],1,"P = A/t. Máy thứ hai thực hiện cùng công trong thời gian ngắn hơn nên công suất lớn hơn."],["Một người dùng lực 150 N để kéo một chiếc xe đi quãng đường 20 m theo phương của lực. Công của người đó thực hiện là:",["300J.","750J.","3.000J.","170J."],2,"A = F.s = 150 × 20 = 3.000J."]]},"bio":{"name":"Sinh học 9","q":[["Di truyền là hiện tượng:",["con sinh ra có các đặc điểm khác với bố mẹ.","truyền đạt các tính trạng của bố mẹ, tổ tiên cho các thế hệ con cháu.","sinh vật có khả năng biến đổi hình thái để thích nghi với môi trường."],1,"Di truyền là sự truyền đạt các tính trạng từ thế hệ trước cho thế hệ sau."],["Biến dị là hiện tượng:",["con sinh ra có các đặc điểm khác nhau và khác bố mẹ.","các thế hệ con cháu luôn giống hệt bố mẹ về mọi mặt.","bố mẹ truyền toàn bộ tính trạng cho con mà không có sự thay đổi.","gene bị mất hoàn toàn ở thế hệ con cháu."],0,"Biến dị làm xuất hiện những đặc điểm khác nhau giữa con với bố mẹ hoặc giữa các cá thể."],["Tính trạng tương phản là",["hai trạng thái khác nhau của cùng một tính trạng.","hai tính trạng giống nhau.","các tính trạng của hai loài khác nhau.","các tính trạng chỉ xuất hiện ở con đực."],0,"Tính trạng tương phản là hai trạng thái khác nhau của cùng một tính trạng."],["Ở chuột, lông đen (A) trội hoàn toàn so với lông nâu (a). Phép lai nào sau đây cho đời con có tỉ lệ phân li kiểu hình là 1 : 1?",["AA × aa.","Aa × aa.","Aa × Aa.","AA × AA."],1,"Aa × aa cho tỉ lệ kiểu hình 1 lông đen : 1 lông nâu."],["Ở một loài thực vật, alen A quy định thân cao trội hoàn toàn so với alen a quy định thân thấp. Cho cây thân cao dị hợp tử tự thụ phấn. Tỉ lệ kiểu gene ở đời con là:",["1AA : 1Aa.","3AA : 1aa.","1AA : 2Aa : 1aa.","1Aa : 1aa."],2,"Aa × Aa cho tỉ lệ kiểu gene 1AA : 2Aa : 1aa."],["Quy luật phân li của Mendel được giải thích dựa trên cơ sở tế bào học nào sau đây?",["Sự xuất hiện 1 kiểu gene ở F₁ và tỉ lệ phân li 1 : 2 : 1 của đời F₂ về kiểu gene.","Sự lấn át của gene trội đối với gene lặn.","Sự phân li của các cặp allele trong giảm phân hình thành giao tử và tổ hợp lại trong thụ tinh.","Khả năng tạo 2 loại giao tử của thế hệ ở F₁."],2,"Các cặp allele phân li trong giảm phân và tổ hợp lại trong thụ tinh."],["Ở một loài hoa, gene A quy định hoa đỏ trội hoàn toàn so với alen a quy định hoa trắng. Cho cây hoa đỏ dị hợp tử tự thụ phấn. Theo lí thuyết, tỉ lệ kiểu hình ở đời con F₂ là:",["100% hoa đỏ.","3 hoa đỏ : 1 hoa trắng.","1 hoa đỏ : 1 hoa trắng.","1 hoa đỏ : 2 hoa hồng : 1 hoa trắng."],1,"Aa × Aa cho tỉ lệ kiểu hình 3 hoa đỏ : 1 hoa trắng."],["Ví dụ nào sau đây là một cặp tính trạng tương phản?",["Hoa đỏ và hoa trắng.","Hoa đỏ và hạt vàng.","Hạt trơn và hoa đỏ.","Thân cao và hạt vàng."],0,"Hoa đỏ và hoa trắng là hai trạng thái của cùng tính trạng màu hoa."],["Một người làm vườn mua được 1 lô cây hoa hồng đỏ rất đẹp. Vì hoa hồng đỏ tính trạng trội hoàn toàn so với hoa hồng trắng, người làm vườn muốn giữ lại những cây hoa hồng thuần chủng để làm giống cho mùa sau. Trong các phương pháp nào sau đây, giúp người làm vườn phân loại chính xác và nhanh nhất, các cây hoa hồng đỏ thuần chủng?",["Cho các cây hoa hồng tự thụ phấn, cây nào ở đời con 100% hoa hồng đỏ là thuần chủng.","Đem lai các cây hoa hồng đỏ với hoa hồng trắng, cây nào ở đời con cho 100% cây hoa hồng đỏ là cây thuần chủng.","Đem lai các cây hoa hồng đỏ với nhau, cặp nào cho đời con có cả hoa đỏ và hoa trắng thì 2 cây bố mẹ đó thuần chủng.","Tiến hành thụ phấn nhân tạo giữa các cây hoa hồng đỏ với 1 số cây hoa hồng đỏ khác đã biết rõ kiểu gene dị hợp."],1,"Lai phân tích với cây hoa trắng aa giúp nhận biết cây hoa đỏ thuần chủng."],["Quá trình tái bản DNA diễn diễn ra bao nhiêu giai đoạn?",["2.","3.","4.","5."],1,"Theo đề cương, đáp án là 3 giai đoạn."],["Gene (gen) là",["một đoạn của phân tử DNA mang thông tin di truyền.","một loại protein trong tế bào.","một loại tế bào sinh dục.","một phân tử đường."],0,"Gene là một đoạn DNA mang thông tin di truyền."],["Chức năng chủ yếu của DNA là",["lưu giữ, bảo quản và truyền đạt thông tin di truyền.","vận chuyển amino acid.","cấu tạo nên ribosome.","tổng hợp glucose."],0,"DNA lưu giữ, bảo quản và truyền đạt thông tin di truyền."]]},"chem":{"name":"Hóa học 9","q":[["Hãy nêu các tính chất vật lí chung của kim loại.",["Dẫn điện, dẫn nhiệt tốt, có ánh kim.","Không dẫn điện, không dẫn nhiệt, không có ánh kim.","Dễ bay hơi, mềm và không có ánh kim.","Không dẫn điện nhưng dẫn nhiệt tốt."],0,"Kim loại có tính dẫn điện, dẫn nhiệt, ánh kim và tính dẻo."],["Sản phẩm tạo thành từ phản ứng của kim loại với khí oxygen thuộc loại nào sau đây?",["oxide acid.","oxide base.","acid.","muối."],1,"Kim loại tác dụng với oxygen tạo oxide kim loại."],["Ở điều kiện thường, kim loại nào sau đây tác dụng được với H₂O?",["Cu.","Fe.","Na.","Ag."],2,"Na phản ứng với nước ở điều kiện thường."],["Ở nhiệt độ cao, hơi nước tác dụng với kim loại sắt tạo ra khí hydrogen và chất nào sau đây?",["FeO.","Fe₂O₃.","Fe₃O₄.","Fe(OH)₂."],2,"3Fe + 4H₂O (hơi) → Fe₃O₄ + 4H₂."],["Nhôm và sắt đều có thể phản ứng với oxygen trong những điều kiện thích hợp. Tuy nhiên, đồ vật bằng nhôm thường được bảo vệ bởi một lớp oxide bám chắc trên bề mặt, còn đồ vật bằng sắt có thể bị gỉ trong không khí ẩm. Nguyên nhân nào sau đây giải thích đúng hiện tượng này?",["nhôm không phản ứng với oxygen, còn sắt luôn phản ứng với nước.","lớp aluminium oxide (Al₂O₃) bám chắc, hạn chế sự tiếp xúc của nhôm với môi trường; lớp gỉ sắt thường không bảo vệ tốt phần sắt bên trong.","sắt không phản ứng với oxygen, còn nhôm dễ bị hòa tan trong nước.","nhôm và sắt đều không phản ứng với oxygen nhưng có màu sắc khác nhau."],1,"Lớp Al₂O₃ bám chắc, còn gỉ sắt không bảo vệ tốt phần sắt bên trong."],["Bạn An cho một mẫu magnesium (Mg) vào ống nghiệm chứa dung dịch hydrochloric acid (HCl) loãng. Hiện tượng bạn An quan sát được là",["không có hiện tượng gì xảy ra.","có bọt khí thoát ra, mẫu Mg tan dần.","xuất hiện chất rắn màu đỏ bám trên mẫu Mg.","dung dịch chuyển sang màu xanh lam."],1,"Mg phản ứng với HCl tạo khí hydrogen."],["Một học sinh thực hiện thí nghiệm cho hai mẫu kim loại zinc (Zn) và copper (Cu) có kích thước tương đương vào hai ống nghiệm riêng biệt, mỗi ống chứa dung dịch HCl loãng. Kết quả nào sau đây là phù hợp?",["Cả hai kim loại đều sủi bọt khí mạnh như nhau.","Zn có bọt khí thoát ra, còn Cu không có hiện tượng rõ rệt.","Cu có bọt khí thoát ra, còn Zn không có hiện tượng rõ rệt.","Cả hai kim loại đều không phản ứng với HCl."],1,"Zn đứng trước H nên phản ứng; Cu đứng sau H nên không phản ứng với HCl loãng."],["Bạn học sinh B cần lựa chọn kim loại để thực hiện thí nghiệm so sánh phản ứng với dung dịch HCl loãng. Để quan sát hiện tượng rõ ràng nhưng không sử dụng kim loại phản ứng quá mãnh liệt. Cặp kim loại nào sau đây phù hợp nhất?",["Sodium (Na) và potassium (K).","Magnesium (Mg) và zinc (Zn).","Silver (Ag) và copper (Cu).","Gold (Au) và silver (Ag)."],1,"Mg và Zn phản ứng với HCl loãng, phù hợp để quan sát so sánh."],["Bạn A cho một mẫu sodium (Na) nhỏ vào cốc nước. Hiện tượng nào sau đây có thể quan sát được?",["Sodium chìm xuống đáy cốc, không có bọt khí thoát ra.","Sodium phản ứng mạnh với nước, chuyển động trên mặt nước và có khí thoát ra.","Sodium tan trong nước nhưng không xảy ra phản ứng hóa học.","Sodium không thay đổi vì không phản ứng với nước ở nhiệt độ thường."],1,"Na phản ứng mạnh với nước, giải phóng khí hydrogen."],["Bạn An cho một mẫu magnesium (Mg) vào ống nghiệm chứa dung dịch hydrochloric acid (HCl) loãng. Hiện tượng bạn An quan sát được là",["không có hiện tượng gì xảy ra.","có bọt khí thoát ra, mẫu Mg tan dần.","xuất hiện chất rắn màu đỏ bám trên mẫu Mg.","dung dịch chuyển sang màu xanh lam."],1,"Mg phản ứng với HCl tạo khí hydrogen."],["Một học sinh thực hiện thí nghiệm cho hai mẫu kim loại zinc (Zn) và copper (Cu) có kích thước tương đương vào hai ống nghiệm riêng biệt, mỗi ống chứa dung dịch HCl loãng. Kết quả nào sau đây là phù hợp?",["Cả hai kim loại đều sủi bọt khí mạnh như nhau.","Zn có bọt khí thoát ra, còn Cu không có hiện tượng rõ rệt.","Cu có bọt khí thoát ra, còn Zn không có hiện tượng rõ rệt.","Cả hai kim loại đều không phản ứng với HCl."],1,"Zn phản ứng với HCl; Cu không phản ứng với HCl loãng."],["Bạn học sinh B cần lựa chọn kim loại để thực hiện thí nghiệm so sánh phản ứng với dung dịch HCl loãng. Để quan sát hiện tượng rõ ràng nhưng không sử dụng kim loại phản ứng quá mãnh liệt. Cặp kim loại nào sau đây phù hợp nhất?",["Sodium (Na) và potassium (K).","Magnesium (Mg) và zinc (Zn).","Silver (Ag) và copper (Cu).","Gold (Au) và silver (Ag)."],1,"Mg và Zn là cặp phù hợp để quan sát so sánh."],["Bạn A cho một mẫu sodium (Na) nhỏ vào cốc nước. Hiện tượng nào sau đây có thể quan sát được?",["Sodium chìm xuống đáy cốc, không có bọt khí thoát ra.","Sodium phản ứng mạnh với nước, chuyển động trên mặt nước và có khí thoát ra.","Sodium tan trong nước nhưng không xảy ra phản ứng hóa học.","Sodium không thay đổi vì không phản ứng với nước ở nhiệt độ thường."],1,"Na phản ứng với nước, tạo NaOH và khí hydrogen."],["Một học sinh cho hai mẫu kim loại magnesium (Mg) và copper (Cu) lần lượt vào hai ống nghiệm chứa dung dịch hydrochloric acid loãng. Kết quả nào sau đây đúng?",["Cả Mg và Cu đều có khí hydrogen thoát ra.","Chỉ có Cu phản ứng và giải phóng khí hydrogen.","Mg phản ứng, có bọt khí hydrogen thoát ra; Cu không phản ứng với dung dịch HCl loãng.","Cả Mg và Cu đều không phản ứng với dung dịch HCl loãng."],2,"Mg đứng trước H, Cu đứng sau H trong dãy hoạt động hóa học."],["Một học sinh muốn so sánh khả năng phản ứng của iron (Fe) và copper (Cu) với dung dịch hydrochloric acid loãng. Cách tiến hành nào sau đây phù hợp nhất để so sánh kết quả?",["Dùng hai mẫu kim loại có kích thước tương đương, cho vào hai ống nghiệm chứa cùng thể tích và nồng độ dung dịch HCl, rồi quan sát hiện tượng.","Cho Fe vào nước và Cu vào dung dịch HCl, sau đó so sánh lượng khí thoát ra.","Cho Fe vào dung dịch HCl đặc, Cu vào dung dịch HCl loãng rồi so sánh tốc độ phản ứng.","Cho đồng thời Fe và Cu vào cùng một ống nghiệm chứa dung dịch HCl, không cần phân biệt hiện tượng ở từng kim loại."],0,"Cần giữ các điều kiện thí nghiệm giống nhau để so sánh."],["Cho ba kim loại Mg, Zn và Cu lần lượt vào ba ống nghiệm chứa cùng thể tích dung dịch HCl loãng, cùng nồng độ và ở cùng nhiệt độ. Dự đoán nào sau đây đúng?",["Cả ba kim loại đều phản ứng với HCl và giải phóng hydrogen.","Mg và Zn phản ứng giải phóng hydrogen; Cu không phản ứng với HCl loãng.","Chỉ có Cu phản ứng với HCl loãng.","Chỉ có Zn phản ứng với HCl loãng."],1,"Mg và Zn đứng trước H; Cu đứng sau H."],["Dãy nào sau đây được sắp xếp đúng theo chiều giảm dần mức độ hoạt động hóa học của kim loại?",["K, Na, Ca, Mg, Al, Zn, Fe, Pb, Cu, H, Ag, Au.","K, Na, Ca, Mg, Al, Zn, Fe, Pb, H, Cu, Ag, Au.","Na, K, Ca, Mg, Al, Fe, Zn, Pb, H, Cu, Ag, Au.","K, Ca, Na, Mg, Al, Zn, Fe, Pb, H, Ag, Cu, Au."],1,"Dãy hoạt động hóa học giảm dần: K, Na, Ca, Mg, Al, Zn, Fe, Pb, H, Cu, Ag, Au."],["Cho các kim loại sau: Fe, Cu, Zn, Ag. Thứ tự sắp xếp các kim loại trong dãy hoạt động hóa học là:",["Cu > Fe > Zn > Ag.","Ag > Cu > Fe > Zn.","Zn > Fe > Cu > Ag.","Fe > Zn > Cu > Ag."],2,"Zn hoạt động mạnh hơn Fe, Fe mạnh hơn Cu, Cu mạnh hơn Ag."],["Cho các kim loại sau: Mg, Al, Zn, Fe, Cu. Kim loại đứng ngay trước đồng (Cu) trong dãy hoạt động hóa học là:",["Al.","Zn.","Fe.","Mg."],2,"Fe đứng ngay trước H và trước Cu trong dãy."],["Trong dãy hoạt động hóa học của kim loại, các kim loại được sắp xếp theo nguyên tắc nào?",["mức độ hoạt động hóa học tăng dần.","mức độ hoạt động hóa học giảm dần.","khối lượng mol tăng dần.","khối lượng mol giảm dần."],1,"Dãy được sắp xếp theo chiều giảm dần mức độ hoạt động hóa học."],["Theo dãy hoạt động hóa học của kim loại, kim loại nào sau đây đứng trước kim loại sắt (Fe)?",["Ag (Silver).","Cu (Copper).","Au (Gold).","Zn (Zinc)."],3,"Zn đứng trước Fe."],["Trong dãy hoạt động hóa học của kim loại, vị trí của kim loại hydrogen (H) nằm ở giữa hai kim loại nào sau đây?",["Iron (Fe) và Copper (Cu).","Zinc (Zn) và Iron (Fe).","Copper (Cu) và Silver (Ag).","Sodium (Na) và Magnesium (Mg)."],0,"H nằm giữa Fe/Pb và Cu trong dãy."],["Trong dãy hoạt động hóa học của kim loại, kim loại đứng trước magnesium (Mg) là potassium (K). Điều này cho biết điều gì?",["K hoạt động hóa học yếu hơn Mg.","K hoạt động hóa học mạnh hơn Mg.","K có khối lượng riêng nhỏ hơn Mg trong mọi điều kiện.","K có nhiệt độ nóng chảy cao hơn Mg trong mọi điều kiện."],1,"Kim loại đứng trước trong dãy hoạt động hóa học mạnh hơn."],["Dựa vào dãy hoạt động hóa học của kim loại, phát biểu nào sau đây đúng?",["Kim loại đứng sau hydrogen đều phản ứng mạnh với dung dịch hydrochloric acid (HCl).","Kim loại đứng trước hydrogen có thể phản ứng với một số dung dịch acid giải phóng khí hydrogen.","Kim loại đứng sau kim loại khác luôn đẩy được kim loại đó ra khỏi dung dịch muối.","Mọi kim loại đều phản ứng với nước ở nhiệt độ thường."],1,"Kim loại đứng trước H có thể đẩy H khỏi một số dung dịch acid."],["Phương pháp thường dùng để tách các kim loại hoạt động hóa học mạnh như potassium (K), sodium (Na), calcium (Ca) khỏi hợp chất của chúng là",["Nhiệt luyện.","Thủy luyện.","Điện phân nóng chảy.","Dùng carbon khử oxide kim loại."],2,"Kim loại hoạt động mạnh thường được điều chế bằng điện phân nóng chảy."],["Phương pháp thường dùng để tách các kim loại hoạt động hóa học trung bình như zinc (Zn), iron (Fe) khỏi oxide của chúng là",["Nhiệt luyện.","Điện phân dung dịch.","Chưng cất.","Lọc."],0,"Zn và Fe có thể điều chế bằng phương pháp nhiệt luyện."],["Nhôm (Aluminium) được điều chế bằng phương pháp điện phân nóng chảy aluminium oxide, còn kẽm (zinc) được điều chế từ quặng zinc sulfide qua các giai đoạn nung quặng trong oxygen để tạo zinc oxide, sau đó khử zinc oxide bằng carbon ở nhiệt độ cao. Sự khác nhau về phương pháp tách hai kim loại này là",["Nhôm và kẽm đều được tách bằng cách khử oxide kim loại bằng carbon.","Nhôm được tách bằng điện phân nóng chảy, còn kẽm được tách bằng phương pháp nhiệt luyện.","Nhôm được tách bằng phương pháp nhiệt luyện, còn kẽm được tách bằng điện phân nóng chảy.","Nhôm và kẽm đều được tách trực tiếp từ quặng bằng cách nung trong oxygen."],1,"Al được điều chế bằng điện phân nóng chảy; Zn bằng nhiệt luyện."],["Hợp kim là gì?",["Chất được tạo thành từ một kim loại duy nhất.","Vật liệu kim loại chứa một kim loại cơ bản và một số kim loại hoặc phi kim khác.","Hỗn hợp gồm nhiều phi kim khác nhau.","Hợp chất được tạo thành từ hai hay nhiều phi kim."],1,"Hợp kim gồm kim loại cơ bản và một số nguyên tố khác."],["Vì sao các hợp kim thép và Duy-ra được sử dụng phổ biến trong công nghiệp và đời sống?",["Vì các hợp kim này đều có khối lượng riêng nhỏ, mềm và dễ nóng chảy hơn các kim loại tạo nên chúng.","Vì các hợp kim này có tính chất phù hợp với nhiều mục đích sử dụng như độ cứng, độ bền cao hoặc khối lượng riêng nhỏ.","Vì các hợp kim này đều có khả năng chống ăn mòn tuyệt đối và không bị biến đổi trong môi trường tự nhiên.","Vì các hợp kim này đều dẫn điện, dẫn nhiệt tốt hơn tất cả các kim loại nguyên chất."],1,"Hợp kim có tính chất phù hợp với nhiều mục đích sử dụng."],["Gang là hợp kim của sắt với carbon và một số nguyên tố khác, trong đó hàm lượng carbon chiếm khoảng:",["dưới 2%.","từ 2% đến 5%.","trên 6%.","từ 10% đến 15%."],1,"Gang thường chứa khoảng 2–5% carbon."],["Thép là hợp kim của sắt với carbon và một số nguyên tố khác, trong đó hàm lượng carbon là:",["dưới 2%.","từ 2% đến 5%.","từ 6% đến 8%.","trên 10%."],0,"Thép chứa dưới 2% carbon."],["Trong lò cao, quặng chứa iron(III) oxide được dùng để sản xuất gang. Khí carbon monoxide (CO) được tạo ra trong lò cao có vai trò gì trong quá trình này?",["Oxi hóa iron(III) oxide thành iron (sắt).","Khử iron(III) oxide thành iron (sắt).","Làm giảm nhiệt độ nóng chảy của iron(III) oxide.","Chuyển iron (sắt) thành iron(III) oxide."],1,"CO là chất khử, khử oxide sắt thành sắt."],["Trong quá trình sản xuất thép từ gang lỏng, người ta thổi khí oxygen vào lò đựng gang nóng chảy. Mục đích chính của giai đoạn này là:",["làm tăng hàm lượng carbon trong gang để tạo thép.","làm nguội gang lỏng để thép đông đặc nhanh hơn.","oxi hóa bớt carbon và một số tạp chất trong gang để thu được thép có thành phần phù hợp.","chuyển toàn bộ sắt trong gang thành iron(III) oxide."],2,"Oxygen oxi hóa bớt carbon và tạp chất trong gang."],["Lưu huỳnh được sử dụng trong công nghiệp để sản xuất chất nào sau đây?",["Sulfuric acid.","Khí oxygen.","Khí nitrogen.","Kim loại nhôm."],0,"Lưu huỳnh là nguyên liệu sản xuất sulfuric acid."],["Khí chlorine được ứng dụng trong đời sống chủ yếu để",["làm nhiên liệu cho động cơ.","sản xuất phân bón nitrogen trực tiếp.","khử trùng nước và tẩy trắng vải.","sản xuất nhựa P.V.C."],2,"Chlorine được dùng để khử trùng nước và tẩy trắng vải."],["Ứng dụng nào sau đây phù hợp với tính chất của than hoạt tính?",["Chế tạo đồ trang sức nhờ độ cứng cao.","Hấp phụ chất màu, mùi và một số chất độc trong nước hoặc không khí.","Sản xuất phân bón nhờ khả năng cung cấp nitrogen.","Khử trùng nước sinh hoạt nhờ khả năng oxi hóa mạnh."],1,"Than hoạt tính có khả năng hấp phụ chất màu, mùi và một số chất."],["Phát biểu nào sau đây không đúng khi nói về sự khác biệt giữa kim loại và phi kim?",["Hầu hết kim loại dẫn điện và dẫn nhiệt tốt, trong khi phần lớn phi kim không dẫn điện hoặc dẫn điện rất kém.","Kim loại có ánh kim, còn phi kim thì không có ánh kim.","Nhiệt độ nóng chảy và khối lượng riêng của phần lớn phi kim nhỏ hơn so với kim loại.","Tất cả các phi kim đều tồn tại ở thể khí ở điều kiện thường."],3,"Không phải tất cả phi kim đều ở thể khí ở điều kiện thường."]]}};
let subject="",answers=[];
const $=id=>document.getElementById(id);
function formatNotation(value){
 return String(value)
  .replace(/W_tA/g,'W<sub>tA</sub>').replace(/W_tB/g,'W<sub>tB</sub>')
  .replace(/h_A/g,'h<sub>A</sub>').replace(/h_B/g,'h<sub>B</sub>')
  .replace(/Wđ/g,'W<sub>đ</sub>').replace(/W_t\\b/g,'W<sub>t</sub>')
  .replace(/v²/g,'v<sup>2</sup>').replace(/m²/g,'m<sup>2</sup>')
  .replace(/F₁/g,'F<sub>1</sub>').replace(/F₂/g,'F<sub>2</sub>')
  .replace(/Al₂O₃/g,'Al<sub>2</sub>O<sub>3</sub>')
  .replace(/Fe₃O₄/g,'Fe<sub>3</sub>O<sub>4</sub>')
  .replace(/H₂O/g,'H<sub>2</sub>O').replace(/H₂/g,'H<sub>2</sub>');
}
function start(s){
 subject=s;answers=Array(bank[s].q.length).fill(null);
 $("home").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");
 $("subjectPill").textContent=bank[s].name;render();
 window.scrollTo({top:0,behavior:"smooth"});
}
function render(){
 const data=bank[subject];
 $("progressText").textContent=`Tổng cộng ${data.q.length} câu hỏi`;
 $("questionList").innerHTML=data.q.map((q,i)=>`
 <article class="question-card" id="question-${i}">
  <div class="q-label">CÂU ${String(i+1).padStart(2,"0")}</div>
  <h3>${formatNotation(q[0])}</h3>
  <div class="question-options">${q[1].map((a,j)=>`<button class="answer ${answers[i]===j?"selected":""}" onclick="choose(${i},${j})"><span class="letter">${"ABCD"[j]}</span><span>${formatNotation(a)}</span></button>`).join("")}</div>
 </article>`).join("");
 updateProgress();
}
function choose(qi,ai){
 answers[qi]=ai;
 const card=$("question-"+qi);
 [...card.querySelectorAll(".answer")].forEach((el,j)=>el.classList.toggle("selected",j===ai));
 updateProgress();
}
function updateProgress(){
 const total=bank[subject].q.length,done=answers.filter(x=>x!==null).length;
 $("answeredText").textContent=`Đã trả lời ${done}/${total}`;
 $("progressBar").style.width=(done/total*100)+"%";
 $("submitHint").textContent=done===total?"Bạn đã trả lời tất cả câu hỏi. Nhấn nút bên dưới để xem kết quả.":`Còn ${total-done} câu chưa trả lời. Bạn có thể cuộn lên xuống để kiểm tra lại.`;
}
function goHome(){$("quiz").classList.add("hidden");$("result").classList.add("hidden");$("home").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})}
function retry(){start(subject)}
function finish(){let qs=bank[subject].q;if(answers.some(x=>x===null)){let n=answers.filter(x=>x===null).length;if(!confirm(`Bạn còn ${n} câu chưa trả lời. Vẫn kiểm tra đáp án?`))return}let right=0;qs.forEach((q,i)=>{if(answers[i]===q[2])right++});let wrong=qs.length-right,pct=Math.round(right/qs.length*100);$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("score").textContent=`${right}/${qs.length}`;$("rightCount").textContent=right;$("wrongCount").textContent=wrong;$("percent").textContent=pct+"%";$("resultTitle").textContent=pct>=80?"Xuất sắc! 🎉":pct>=50?"Bạn làm khá tốt!":"Cố gắng thêm nhé!";$("scoreText").textContent=`Bạn đã hoàn thành phần ${bank[subject].name}. ${pct>=80?" ":"Xem lại các câu bên dưới để củng cố kiến thức."}`;let bad=qs.map((q,i)=>({q,i})).filter(x=>answers[x.i]!==x.q[2]);$("reviewList").innerHTML=bad.length?bad.map(({q,i})=>`<article class="reviewitem"><div class="tag">CÂU ${i+1} • ${answers[i]===null?"CHƯA TRẢ LỜI":"CHƯA CHÍNH XÁC"}</div><p><b>${formatNotation(q[0])}</b></p><p class="wrong">Bạn chọn: ${answers[i]===null?"Chưa chọn": "ABCD"[answers[i]]+". "+q[1][answers[i]]}</p><p class="correct">Đáp án đúng: ${"ABCD"[q[2]]}. ${formatNotation(q[1][q[2]])}</p><p>${formatNotation(q[3])}</p></article>`).join(""):'<div class="empty">🎉 Tuyệt vời! Bạn trả lời đúng tất cả câu hỏi.</div>'}
function retry(){start(subject)}
function goHome(){$("quiz").classList.add("hidden");$("result").classList.add("hidden");$("home").classList.remove("hidden")}
$("themeBtn").addEventListener("click",()=>{let dark=document.documentElement.dataset.theme!=="dark";document.documentElement.dataset.theme=dark?"dark":"light";$("themeBtn").innerHTML=dark?"☀ <span>Giao diện sáng</span>":"☾ <span>Giao diện tối</span>";document.querySelector('meta[name="theme-color"]').content=dark?"#0e1422":"#f5f7fb"});
</script></body></html>
